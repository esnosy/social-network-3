<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar">
    <div class="navbar-container">
        <a href="/" class="navbar-brand">Social Network</a>

        <input type="checkbox" id="navbar-toggle" class="navbar-toggle">
        <label for="navbar-toggle" class="navbar-hamburger">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <ul class="navbar-menu">
            {% if is_logged_in %}
            <li><a href="/messages" class="nav-link">Messages</a></li>
            <li><a href="/logout" class="nav-link nav-btn">Log Out</a></li>
            {% endif %}
        </ul>
    </div>
</nav>
{% block body %}{% endblock %}

<!-- Stack Wrapper -->
<div class="notifications-container" id="notificationsContainer">

    {% for fm in get_flashed_messages() %}
    <div class="notification-card" role="alert" aria-live="polite">
        <div class="notification-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
        </div>

        <div class="notification-content">
            <!--            <h2 class="notification-title">System Update</h2>-->
            <p class="notification-message">{{ fm }}</p>
        </div>

        <button type="button" class="dismiss-btn" aria-label="Dismiss notification">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
    </div>
    {% endfor %}
</div>
<script>
    const container = document.getElementById('notificationsContainer');

    // Event Delegation: One listener handles all current & future cards
    container.addEventListener('click', (event) => {
        const dismissBtn = event.target.closest('.dismiss-btn');
        if (!dismissBtn) return;

        const card = dismissBtn.closest('.notification-card');
        if (card) {
            card.classList.add('dismissed');
            card.addEventListener('transitionend', () => {
                card.remove();
            }, {once: true});
        }
    });
</script>
</body>
</html>
